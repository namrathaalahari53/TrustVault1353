services:
  # Full-Stack Web Service (Recommended: Runs backend APIs, database, and serves frontend)
  - type: web
    name: trustvault-web
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: trustvault-data
      mountPath: /app/data
      sizeGB: 1
